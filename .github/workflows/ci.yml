name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by full commit SHA (the tag is in the comment). To update one:
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uvx ruff@0.17.0 check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      # node runs `node --check` on the assembled dashboard script (tests/test_web.py).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The rendering tests need a headless Chromium. GitHub's Ubuntu image ships Google Chrome; Ubuntu 24.04
      # restricts the unprivileged user namespaces Chrome's sandbox uses, so lift that on the throwaway runner.
      - name: Browser for the rendering tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo "RUNLENS_BROWSER=$(command -v google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version

      - run: uv sync --locked
      - name: Tests
        run: uv run python -m unittest discover -s tests -v 2>&1 | tee test.log
      # GitHub's Windows and macOS images ship Chrome too (tests/test_web.py looks in its install paths), so a
      # skipped dashboard test is a failure on every OS, not only on Linux.
      - name: The node and browser tests ran
        run: |
          if grep -E '\(tests\.test_web\.[^)]*\) \.\.\. skipped' test.log; then
            echo "::error::dashboard tests were skipped: node or the browser is missing"
            exit 1
          fi

      - name: Build the wheel
        run: uv build --wheel --out-dir dist
      - name: The wheel holds every packaged asset
        run: |
          uv run --no-project python - <<'EOF'
          import glob, subprocess, zipfile
          wheel = glob.glob("dist/runlens-*.whl")[0]
          inside = set(zipfile.ZipFile(wheel).namelist())
          tracked = subprocess.run(["git", "ls-files", "runlens"], capture_output=True, text=True, check=True).stdout.split()
          wanted = [f for f in tracked if not f.endswith(".pyc")]
          missing = [f for f in wanted if f not in inside]
          assert not missing, f"not in {wheel}: {missing}"
          assert any(f.startswith("runlens/web/js/") for f in inside), "no dashboard scripts in the wheel"
          print(f"{wheel}: all {len(wanted)} tracked package files present")
          EOF
      # Outside the checkout, on an empty RUNLENS_HOME, so only the installed wheel can answer.
      - name: Smoke-test the installed CLI
        env:
          RUNLENS_HOME: ${{ runner.temp }}/runlens-home
        run: |
          wheel="$(pwd -W 2>/dev/null || pwd)/$(ls dist/runlens-*.whl)"   # pwd -W: a native path on Windows
          cd "$RUNNER_TEMP"
          rl() { uv run --isolated --no-project --python "${{ matrix.python }}" --with "$wheel" runlens "$@"; }
          rl --help
          rl dashboard --out dashboard.html
          grep -q '<script id="data" type="application/json">' dashboard.html
          if grep -q '{{' dashboard.html; then echo "::error::unfilled template placeholder"; exit 1; fi
          rl score

      # install / uninstall end to end, against throwaway settings and home so nothing real is touched.
      - name: Smoke-test install and uninstall
        env:
          RUNLENS_HOME: ${{ runner.temp }}/runlens-install-home
          CLAUDE_SETTINGS: ${{ runner.temp }}/claude-install/settings.json
        run: |
          wheel="$(pwd -W 2>/dev/null || pwd)/$(ls dist/runlens-*.whl)"
          mkdir -p "$RUNNER_TEMP/claude-install"
          echo '{"theme": "dark"}' > "$CLAUDE_SETTINGS"
          cd "$RUNNER_TEMP"
          export HOME="$RUNNER_TEMP/fake-home" USERPROFILE="$RUNNER_TEMP/fake-home"   # the skill is copied under ~/.claude/skills
          rl() { uv run --isolated --no-project --python "${{ matrix.python }}" --with "$wheel" runlens "$@"; }
          rl install
          grep -q runlens "$CLAUDE_SETTINGS"
          grep -q '"theme"' "$CLAUDE_SETTINGS"
          test -f "$RUNLENS_HOME/config.toml"
          test -f "$HOME/.claude/skills/runlens-retro/SKILL.md"
          rl install   # a second install must not add a second hook
          test "$(grep -c SessionEnd "$CLAUDE_SETTINGS")" = 1
          rl uninstall
          if grep -q runlens "$CLAUDE_SETTINGS"; then echo "::error::uninstall left the hook"; exit 1; fi
          grep -q '"theme"' "$CLAUDE_SETTINGS"
