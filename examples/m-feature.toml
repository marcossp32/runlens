# runlens config for mstack's /m-feature flow (https://github.com/marcossp32/mstack).
# Copy to ~/.runlens/config.toml. Everything flow-specific lives here; the code stays generic.
# runlens/config.example.toml documents every option; this file sets only what the flow needs.

[select]
# Defaults for `archive`, `refresh` and the SessionEnd hook (CLI flags override them).
since = "2026-09-28"     # runs started on or after this date (example)
skills = ["m-feature"]   # keep runs that used any of these skills; [] = every run
projects = []            # substrings of the run's cwd; [] = any

# Extra files the flow writes outside the transcript, kept with the run.
# mstack keeps every feature's prove/review output under .git/mstack, so only the files written while
# this run was going belong to it (scope = "run"). Contents are stored once, browser profiles from the
# prove step (Cookies, Login Data, Local Storage...) are never kept, and each run keeps at most max_mb.
[[evidence]]
name = "mstack"
glob = "{git_dir}/mstack/**/*"
scope = "run"
max_mb = 200
exclude = ["**/*.webm", "**/*.mp4"]   # screen recordings from the prove step (screenshots are kept)

# Markers: regexes that turn flow output into rows of the `markers` table.
# bad = values that mean something went wrong ("*" = every match); each bad match becomes an incident.

[[marker]]
name = "step_check"      # printed after each build step: the step's own check passed or failed
source = "tool_result"
pattern = '^STEP CHECK: (PASS|FAIL)\b'
bad = ["FAIL"]

[[marker]]
name = "suite"
source = "tool_result"
pattern = '^SUITE (WORSE|BETTER|SAME|not comparable)\b'
bad = ["WORSE"]

[[marker]]
name = "replan"
source = "tool_input"
pattern = 'Replanned: ([^"]{0,200})'
bad = "*"

# Outcomes: what a good run of a skill looks like. A unit uses the first entry whose skills include it,
# so m-build and the m-stack group (which holds m-build) are judged by the step check, and m-feature
# by whether the session opened a PR.

[[outcome]]
name = "step check first-pass rate"
marker = "step_check"
success = ["PASS"]
failure = ["FAIL"]
skills = ["m-build"]

[[outcome]]
name = "PR opened"
pr = "opened"
skills = ["m-feature"]

# m-grilling's job is to ask the human, so its questions are shown but not scored. The group holds it too.
[weights.m-grilling]
interventions = 0

[weights.m-stack]
interventions = 0

# The m-* skills are usually edited together. A verdict on one of them is then "confounded" (the others
# changed in the same runs), so the group is the level at which an edit to the flow can be judged.
[[group]]
name = "m-stack"
members = ["skill:m-feature", "skill:m-scan", "skill:m-grilling", "skill:m-research", "skill:m-plan",
           "skill:m-build", "skill:m-review", "skill:m-prove"]
